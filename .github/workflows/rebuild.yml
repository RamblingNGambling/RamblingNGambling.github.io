name: Rebuild site from plays.json
on:
  push:
    branches: [main]
    paths: ['plays.json', 'og.png', 'robots.txt', 'build/**']
  workflow_dispatch:

concurrency:
  group: tracker-site-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site
        run: node build/build.mjs
      - name: Deploy to site branch
        run: |
          cp -r build/dist /tmp/dist-new
          git checkout -- . || true
          git clean -fd build/dist || true
          git fetch origin site
          git switch site
          git reset --hard origin/site
          git ls-files -z | xargs -0 -r git rm -q
          cp -r /tmp/dist-new/. .
          git add -A
          git diff --cached --quiet && echo "no changes to publish" && exit 0
          git commit -m "Rebuild site from plays.json"
          git push origin site
