  <article class="tpage" id="view-cheat">
    <header class="phero">
      <p class="kicker" data-rv><a href="{{rel}}#tools">Tools</a> / <b>Cheat sheet</b></p>
      <h1 class="th" data-rv>Percent to <em>American odds</em></h1>
      <p class="lede" data-rv>Every percentage from 1 to 99, whole or in halves, with the price that pays fairly for it. No vig. Use it to read a Kalshi, Novig or Polymarket price as a sportsbook line.</p>
    </header>

    <div class="panel tcard wide" data-rv>
      <div class="phead tbar"><h2 class="h3">Quick look-up</h2>
        <div class="tact">
          <div class="seg csteps" role="group" aria-label="Step size">
            <button type="button" class="sg on" data-step="1" aria-pressed="true">Whole %</button>
            <button type="button" class="sg" data-step="0.5" aria-pressed="false">Half %</button>
          </div>
          <div class="cfind tin" style="padding:0"><label for="cf">Jump to</label><input type="text" id="cf"
            placeholder="55" inputmode="decimal" autocomplete="off" aria-label="Highlight a percentage"></div>
        </div>
      </div>
      <div class="csheet" id="csheet"></div>
    </div>
  </article>
